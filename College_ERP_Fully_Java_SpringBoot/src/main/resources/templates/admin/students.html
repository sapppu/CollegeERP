<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Students</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f6f9; min-height: 100vh; }

        .navbar {
            background: #1e3799;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h2 { font-size: 18px; }
        .navbar a { color: white; text-decoration: none; font-weight: bold; font-size: 14px; }

        .content { padding: 30px; }

        h2.page-title {
            color: #1e3799;
            font-size: 22px;
            margin-bottom: 20px;
        }

        /* ── Top actions bar ── */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .top-bar-left { display: flex; align-items: center; gap: 12px; }
        .top-bar-right { display: flex; align-items: center; gap: 12px; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary { background: #1e3799; color: white; }
        .btn-primary:hover { background: #4a69bd; }
        .btn-danger  { background: #e55039; color: white; }
        .btn-danger:hover  { background: #c0392b; }
        .btn-danger:disabled {
            background: #ccc;
            color: #888;
            cursor: not-allowed;
        }

        /* ── Selection info strip ── */
        .selection-bar {
            display: none;
            align-items: center;
            gap: 14px;
            background: linear-gradient(135deg, #eaf0ff, #dfe6f6);
            border: 1px solid #b0c4de;
            border-radius: 10px;
            padding: 12px 20px;
            margin-bottom: 18px;
            animation: slideDown 0.25s ease;
        }
        .selection-bar.visible { display: flex; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .selection-bar .sel-count {
            font-size: 14px;
            font-weight: bold;
            color: #1e3799;
        }
        .selection-bar .sel-actions { margin-left: auto; display: flex; gap: 10px; }
        .btn-outline {
            background: transparent;
            border: 1px solid #1e3799;
            color: #1e3799;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-outline:hover { background: #1e3799; color: white; }
        .btn-sm-danger {
            background: #e55039;
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-sm-danger:hover { background: #c0392b; }

        /* ── Alert banner ── */
        .alert {
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alert-success {
            background: #e0faf4;
            border: 1px solid #00b894;
            color: #00755a;
        }

        /* ── Table ── */
        .table-wrapper {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        table { width: 100%; border-collapse: collapse; }
        th, td {
            padding: 13px 16px;
            text-align: center;
            font-size: 14px;
        }
        th {
            background: #1e3799;
            color: white;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        td { border-bottom: 1px solid #f1f2f6; color: #444; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8f9ff; }
        tr.selected td { background: #eaf0ff; }

        /* Checkbox styling */
        .cb-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #1e3799;
        }

        /* Action links */
        .action-link {
            display: inline-block;
            text-decoration: none;
            padding: 5px 12px;
            border-radius: 6px;
            color: white;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .action-edit   { background: #38ada9; }
        .action-edit:hover   { background: #2d8e89; }
        .action-delete { background: #e55039; }
        .action-delete:hover { background: #c0392b; }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-blue   { background: #eaf0ff; color: #1e3799; }
        .badge-green  { background: #e0faf4; color: #00b894; }

        .empty-msg {
            text-align: center;
            color: #aaa;
            padding: 40px 20px;
            font-size: 15px;
        }

        .student-count {
            font-size: 13px;
            color: #888;
            font-weight: normal;
        }
    </style>
</head>
<body>

<div class="navbar">
    <h2>College ERP — All Students</h2>
    <a href="/admin/dashboard">⬅ Dashboard</a>
</div>

<div class="content">

    <!-- Bulk delete success message -->
    <div th:if="${bulkDeleteMsg}" class="alert alert-success">
        <span>✅</span>
        <strong th:text="${bulkDeleteMsg}"></strong>
    </div>

    <h2 class="page-title">
        👨‍🎓 All Students
        <span class="student-count" th:text="'(' + ${list.size()} + ' total)'"></span>
    </h2>

    <div class="top-bar">
        <div class="top-bar-left">
            <a href="/admin/add-student" class="btn btn-primary">➕ Add New Student</a>
        </div>
        <div class="top-bar-right" style="display:flex; gap:12px;">
            <a href="/admin/export-students" class="btn btn-primary" style="background:#00b894;">📥 Export Excel</a>
        </div>
    </div>

    <!-- Selection action bar (shown when items are selected) -->
    <form action="/admin/delete-students-bulk" method="post" id="bulkForm">
        <div class="selection-bar" id="selectionBar">
            <span class="sel-count" id="selCount">0 selected</span>
            <div class="sel-actions">
                <button type="button" class="btn-outline" onclick="clearSelection()">✕ Clear Selection</button>
                <button type="submit" class="btn-sm-danger"
                        onclick="return confirm('Are you sure you want to delete the selected students? This will also remove their login accounts.')">
                    🗑️ Delete Selected
                </button>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th style="width:45px;">
                            <div class="cb-wrap">
                                <input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)">
                            </div>
                        </th>
                        <th>ID</th>
                        <th>Enrollment No</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Department</th>
                        <th>Year</th>
                        <th>Username</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(list)}">
                        <td colspan="10" class="empty-msg">No students found. Click "Add New Student" to get started.</td>
                    </tr>
                    <tr th:each="s : ${list}" th:id="'row-' + ${s.id}">
                        <td>
                            <div class="cb-wrap">
                                <input type="checkbox" name="ids" th:value="${s.id}" class="row-cb"
                                       onclick="updateSelection()">
                            </div>
                        </td>
                        <td th:text="${s.id}"></td>
                        <td th:text="${s.enrollmentNo}"></td>
                        <td th:text="${s.name}"></td>
                        <td th:text="${s.email}"></td>
                        <td th:text="${s.phone}"></td>
                        <td><span class="badge badge-blue" th:text="${s.department}">-</span></td>
                        <td><span class="badge badge-green" th:text="${s.year}">-</span></td>
                        <td th:text="${s.username}"></td>
                        <td>
                            <a th:href="@{/admin/edit-student/{id}(id=${s.id})}" class="action-link action-edit">Edit</a>
                            <a th:href="@{/admin/delete-student/{id}(id=${s.id})}" class="action-link action-delete"
                               onclick="return confirm('Delete this student and their login?')">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </form>
</div>

<script>
    var checkboxes = document.querySelectorAll('.row-cb');
    var selectAll  = document.getElementById('selectAll');
    var selBar     = document.getElementById('selectionBar');
    var selCount   = document.getElementById('selCount');

    function updateSelection() {
        var checked = document.querySelectorAll('.row-cb:checked');
        var count = checked.length;
        var total = checkboxes.length;

        // Update select-all state
        selectAll.checked = total > 0 && count === total;
        selectAll.indeterminate = count > 0 && count < total;

        // Show/hide selection bar
        if (count > 0) {
            selBar.classList.add('visible');
            selCount.textContent = count + ' student' + (count > 1 ? 's' : '') + ' selected';
        } else {
            selBar.classList.remove('visible');
        }

        // Highlight selected rows
        checkboxes.forEach(function(cb) {
            var row = cb.closest('tr');
            if (cb.checked) {
                row.classList.add('selected');
            } else {
                row.classList.remove('selected');
            }
        });
    }

    function toggleSelectAll(master) {
        checkboxes.forEach(function(cb) {
            cb.checked = master.checked;
        });
        updateSelection();
    }

    function clearSelection() {
        selectAll.checked = false;
        checkboxes.forEach(function(cb) { cb.checked = false; });
        updateSelection();
    }
</script>

</body>
</html>
