# Production — set env vars in Render / Railway / Fly (not Vercel)
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_JDBC_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Ephemeral disk on most PaaS — photos reset on redeploy unless you add object storage later
app.upload.dir=${APP_UPLOAD_DIR:/tmp/uploads/profiles}
